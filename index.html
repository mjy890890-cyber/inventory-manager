<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>库存管理系统</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #2c86c8;
      --blue-dark: #1f6fae;
      --line: #d2d2d2;
      --grid: #e7e7e7;
      --text: #333;
      --muted: #666;
      --cream: #fffbe4;
      --orange: #ff7f1f;
      --danger: #c7352f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1280px;
      overflow: hidden;
      color: var(--text);
      background: #fff;
      font-size: 12px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .erp {
      height: 100vh;
      border-top: 3px solid var(--blue);
      display: grid;
      grid-template-rows: 35px 1fr 34px;
    }
    .top-tabs {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background: #eee;
      border-bottom: 1px solid #cfcfcf;
    }
    .tab-left { display: flex; align-items: stretch; }
    .tab {
      min-width: 86px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #d0d0d0;
      background: #e5e5e5;
      user-select: none;
    }
    .tab.active {
      color: #1683d4;
      background: #f4fbff;
      font-weight: 600;
    }
    .tab .close {
      margin-left: 10px;
      color: #1683d4;
      font-size: 16px;
      line-height: 1;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
    }
    .tiny-icon {
      width: 18px;
      height: 18px;
      border: 0;
      background: transparent;
      color: #666;
      padding: 0;
    }
    .ghost-btn {
      height: 26px;
      padding: 0 9px;
      border: 1px solid #d2d2d2;
      background: #f7f7f7;
      border-radius: 2px;
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 244px 1fr;
    }
    .left-pane {
      min-height: 0;
      border-right: 1px solid #cfcfcf;
      background: #f7f7f7;
      display: grid;
      grid-template-rows: 51px 1fr;
    }
    .locate {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 5px;
      align-items: center;
      padding: 9px 4px;
      border-bottom: 1px solid #d8d8d8;
    }
    input, select {
      height: 30px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0 7px;
      outline: none;
      border-radius: 0;
    }
    .locate button, .querybar button, .query-options button, .bottom-bar button {
      height: 30px;
      border: 1px solid var(--line);
      background: #f8f8f8;
      padding: 0 9px;
      border-radius: 0;
    }
    .category-tree { overflow: auto; background: #fff; }
    .tree-node {
      width: 100%;
      height: 29px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      border: 0;
      border-bottom: 1px solid var(--grid);
      background: #fff;
      color: #333;
      text-align: left;
    }
    .tree-node.root {
      height: 27px;
      color: var(--orange);
      background: #fff2e4;
      font-weight: 600;
    }
    .tree-node.sub { padding-left: 29px; border-bottom: 0; }
    .tree-node.child { padding-left: 48px; color: #555; }
    .tree-node.active { color: #0e6ead; background: #dff1ff; }
    .tree-caret {
      width: 12px;
      color: var(--orange);
      display: inline-block;
      text-align: center;
    }
    .main-pane {
      min-width: 0;
      min-height: 0;
      background: #fff;
      display: grid;
      grid-template-rows: 85px 1fr;
    }
    .query-area {
      background: #fafafa;
      border-bottom: 1px solid #cfcfcf;
      display: grid;
      grid-template-rows: 43px 42px;
    }
    .querybar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 5px 14px;
      white-space: nowrap;
    }
    .querybar .warehouse { width: 150px; }
    .querybar .quick { width: 118px; }
    .querybar .search { width: 230px; }
    .blue-btn {
      min-width: 58px;
      border-color: var(--blue-dark) !important;
      background: var(--blue) !important;
      color: #fff !important;
      font-weight: 600;
    }
    .query-options {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 10px 8px;
      white-space: nowrap;
    }
    .query-options label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .query-options input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #4c95da;
    }
    .query-options select { min-width: 170px; }
    .table-region {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 30px 34px;
      padding: 0 6px;
      background: #fff;
    }
    .table-wrap {
      overflow: hidden;
      border: 1px solid #bfc9d2;
      border-top: 0;
      position: relative;
    }
    .table-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1320px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    thead {
      background: var(--blue);
      color: #fff;
      font-size: 12px;
    }
    th, td {
      height: 30px;
      padding: 0 6px;
      border-right: 1px solid var(--grid);
      border-bottom: 1px solid var(--grid);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }
    th {
      height: 29px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--blue);
      border-right-color: #9bc7e8;
      text-align: center;
      font-weight: 600;
    }
    th[data-sort] {
      cursor: pointer;
      user-select: none;
    }
    th[data-sort]::after {
      content: "";
      display: inline-block;
      width: 12px;
      color: #e9f6ff;
      text-align: right;
    }
    th[data-sort].sort-asc::after { content: "▲"; }
    th[data-sort].sort-desc::after { content: "▼"; }
    tbody tr:nth-child(odd) td { background: #fcfcfc; }
    tbody tr:first-child td { background: var(--cream); }
    tbody tr:hover td, tbody tr.selected td { background: #eaf5ff; }
    .index-col {
      width: 66px;
      text-align: center;
      background: #eef8fd !important;
      color: #444;
    }
    th.index-col {
      background: var(--blue) !important;
      color: #fff;
    }
    .detail-index {
      height: 22px;
      min-width: 44px;
      border: 0;
      background: transparent;
      color: #444;
      padding: 0;
      text-align: left;
    }
    .detail-index:hover { color: var(--blue-dark); text-decoration: underline; }
    .sku-col { width: 100px; }
    .name-col { width: 275px; }
    .unit-col { width: 90px; }
    .num-col { width: 80px; text-align: right; font-variant-numeric: tabular-nums; }
    .money-col { width: 82px; text-align: right; font-variant-numeric: tabular-nums; }
    .status-col { width: 82px; }
    .remark-col { width: 118px; }
    .op-col { width: 58px; text-align: center; }
    .stock-negative { color: var(--danger); font-weight: 700; }
    .stock-low { color: #a35b00; font-weight: 700; }
    .detail-btn {
      height: 23px;
      min-width: 42px;
      border: 1px solid #cfcfcf;
      background: #fff;
      color: #333;
      padding: 0 6px;
      border-radius: 2px;
    }
    .detail-btn:hover {
      border-color: var(--blue);
      color: var(--blue-dark);
      background: #eef8ff;
    }
    .empty-state {
      display: none;
      padding: 42px;
      text-align: center;
      color: var(--muted);
    }
    .sum-row {
      min-width: 1320px;
      display: grid;
      grid-template-columns: 166px 1fr 90px 80px 80px 82px 82px 82px 80px 80px 80px 82px 118px 58px;
      overflow: hidden;
      border: 1px solid #c6c6c6;
      border-top: 0;
      background: var(--cream);
    }
    .sum-row div {
      height: 29px;
      line-height: 29px;
      padding: 0 6px;
      border-right: 1px solid var(--grid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .sum-row .right { text-align: right; }
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 5px;
      background: #fff;
    }
    .tabs-bottom, .pager {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .bottom-tab {
      height: 28px;
      border: 1px solid #d2d2d2;
      background: #f6f6f6;
      padding: 0 10px;
    }
    .bottom-tab.active {
      background: #fff;
      border-top: 2px solid var(--blue);
      color: var(--blue-dark);
    }
    .pager { gap: 7px; color: #444; }
    .pager select {
      width: 64px;
      height: 26px;
      padding: 0 4px;
    }
    .pager button {
      min-width: 28px;
      height: 26px;
      border: 0;
      background: transparent;
      color: #555;
      font-size: 16px;
      padding: 0 3px;
    }
    .pager button:disabled { color: #aaa; cursor: not-allowed; }
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 3px 8px;
      border-top: 1px solid #d2d2d2;
      background: #f3f3f3;
    }
    .footer button {
      height: 27px;
      border: 1px solid #d0d0d0;
      background: #fff;
      padding: 0 10px;
      border-radius: 0;
    }
    .footer button.disabled { color: #999; background: #efefef; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(0, 0, 0, .28);
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(850px, 92vw);
      max-height: 86vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #8fbbe1;
      box-shadow: 0 14px 36px rgba(0, 0, 0, .25);
    }
    .modal-header {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      background: var(--blue);
      color: #fff;
    }
    .modal-title {
      margin: 0;
      max-width: 720px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
      font-weight: 600;
    }
    .modal-header button {
      width: 26px;
      height: 26px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 18px;
    }
    .modal-body { padding: 10px; overflow: auto; }
    .modal-subtitle { margin: 2px 0 10px; color: var(--muted); }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .detail-cell {
      min-height: 48px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: #fafafa;
    }
    .detail-cell span { display: block; color: var(--muted); margin-bottom: 5px; }
    .detail-cell strong { font-size: 14px; font-variant-numeric: tabular-nums; }
    .flow-table { min-width: 760px; border: 1px solid var(--grid); }
    .flow-table th:nth-child(1), .flow-table td:nth-child(1),
    .flow-table th:nth-child(2), .flow-table td:nth-child(2) { width: 90px; text-align: left; }
    .flow-table th:nth-child(3), .flow-table td:nth-child(3),
    .flow-table th:nth-child(4), .flow-table td:nth-child(4),
    .flow-table th:nth-child(5), .flow-table td:nth-child(5) { width: 90px; text-align: right; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 44px;
      display: none;
      max-width: 380px;
      padding: 9px 12px;
      background: #333;
      color: white;
      border-radius: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      line-height: 1.45;
      z-index: 30;
    }
    .toast.show { display: block; }
  </style>
</head>

    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">库存进出详情</h3>
        <button id="closeModalBtn" type="button" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-subtitle" id="modalSubtitle"></p>
        <div class="detail-grid" id="detailGrid"></div>
        <table class="flow-table">
          <thead><tr><th>日期</th><th>类型</th><th>入库</th><th>出库</th><th>结存</th><th>说明</th></tr></thead>
          <tbody id="flowBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const inventoryDataset = JSON.parse(document.getElementById("inventory-data").textContent);
    const inventory = Array.isArray(inventoryDataset) ? inventoryDataset : inventoryDataset.details;
    const totalInventoryRows = Array.isArray(inventoryDataset) ? inventoryDataset : inventoryDataset.totalRows;
    const els = {
      categoryLocate: document.getElementById("categoryLocate"),
      locateBtn: document.getElementById("locateBtn"),
      searchInput: document.getElementById("searchInput"),
      quickField: document.getElementById("quickField"),
      showDisabled: document.getElementById("showDisabled"),
      stockFilter: document.getElementById("stockFilter"),
      clearBtn: document.getElementById("clearBtn"),
      queryBtn: document.getElementById("queryBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      inventoryBody: document.getElementById("inventoryBody"),
      emptyState: document.getElementById("emptyState"),
      recordCount: document.getElementById("recordCount"),
      pageSize: document.getElementById("pageSize"),
      pageSelect: document.getElementById("pageSelect"),
      firstPage: document.getElementById("firstPage"),
      prevPage: document.getElementById("prevPage"),
      nextPage: document.getElementById("nextPage"),
      lastPage: document.getElementById("lastPage"),
      pageStock: document.getElementById("pageStock"),
      pageSaleable: document.getElementById("pageSaleable"),
      pageAmount: document.getElementById("pageAmount"),
      summaryText: document.getElementById("summaryText"),
      modalBackdrop: document.getElementById("modalBackdrop"),
      closeModalBtn: document.getElementById("closeModalBtn"),
      modalTitle: document.getElementById("modalTitle"),
      modalSubtitle: document.getElementById("modalSubtitle"),
      detailGrid: document.getElementById("detailGrid"),
      flowBody: document.getElementById("flowBody"),
      importBtn: document.getElementById("importBtn"),
      futureImportNav: document.getElementById("futureImportNav"),
      exportCsvBtn: document.getElementById("exportCsvBtn"),
      detailOpenBtn: document.getElementById("detailOpenBtn"),
      printBtn: document.getElementById("printBtn"),
      toast: document.getElementById("toast")
    };
    let currentRows = [];
    let pageRows = [];
    let currentPage = 1;
    let categoryFilter = "all";
    let selectedSku = "";
    let selectedRowKey = "";
    let sortState = { key: "", direction: "asc", type: "text" };
    const moneyFormat = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    function num(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }
    function formatNumber(value, digits = 4) {
      const parsed = num(value);
      if (Number.isInteger(parsed)) return parsed.toLocaleString("zh-CN");
      return parsed.toLocaleString("zh-CN", { maximumFractionDigits: digits });
    }
    function formatMoney(value) { return moneyFormat.format(num(value)); }
    function escapeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }
    function stockClass(value) {
      const stock = num(value);
      if (stock < 0) return "stock-negative";
      if (stock >= 0 && stock <= 5) return "stock-low";
      return "";
    }
    function categoryMatches(item) {
      if (categoryFilter === "all") return true;
      const name = String(item["商品名称"] || "");
      const remark = String(item["商品备注"] || "");
      const source = String(item["来源分类"] || "");
      const stock = num(item["库存数量"]);
      if (categoryFilter === "negative") return stock < 0;
      if (categoryFilter === "low") return stock >= 0 && stock <= 5;
      if (categoryFilter === "鱼仔") {
        return source === "鱼仔" || source === "玛蒂德肤" || name.includes("鱼仔") || remark.includes("鱼仔");
      }
      if (categoryFilter === "uncategorized") {
        return source === "总表" && !["保税", "鱼仔", "浴见", "赫格丽", "玛蒂德肤", "伊菲丹", "AQUIS"].some(key => name.includes(key) || remark.includes(key));
      }
      return source.includes(categoryFilter) || name.includes(categoryFilter) || remark.includes(categoryFilter);
    }
    function passesStockFilter(item, filter) {
      const stock = num(item["库存数量"]);
      if (filter === "all") return stock !== 0;
      if (filter === "withZero") return true;
      if (filter === "positive") return stock > 0;
      if (filter === "low") return stock >= 0 && stock <= 5;
      if (filter === "negative") return stock < 0;
      return true;
    }
    function matchesKeyword(item) {
      const keyword = els.searchInput.value.trim().toLowerCase();
      if (!keyword) return true;
      const field = els.quickField.value;
      const chunks = {
        sku: [item["商品编号"]],
        name: [item["商品名称"]],
        remark: [item["商品备注"]],
        all: [item["商品编号"], item["商品名称"], item["商品备注"], item["状态"], item["来源分类"]]
      }[field] || [];
      return chunks.join(" ").toLowerCase().includes(keyword);
    }
    function updateSummary() {
      const active = inventory.filter(item => item["状态"] === "启用").length;
      const stock = inventory.reduce((sum, item) => sum + num(item["库存数量"]), 0);
      const negative = inventory.filter(item => num(item["库存数量"]) < 0).length;
      els.summaryText.textContent = `商品数 ${inventory.length}，启用 ${active}，库存总数 ${formatNumber(stock)}，负库存 ${negative}，初始库存来自：/Users/fififun/Downloads/库存，生成时间：2026-06-01 11:22`;
    }
    function getPageCount() {
      return Math.max(1, Math.ceil(currentRows.length / Number(els.pageSize.value)));
    }
    function sortValue(item, key) {
      if (key === "行号") return currentRows.indexOf(item) + 1;
      return item[key] ?? "";
    }
    function applySort() {
      if (!sortState.key) return;
      const direction = sortState.direction === "asc" ? 1 : -1;
      currentRows.sort((a, b) => {
        const left = sortValue(a, sortState.key);
        const right = sortValue(b, sortState.key);
        if (sortState.type === "number") {
          return (num(left) - num(right)) * direction;
        }
        return String(left).localeCompare(String(right), "zh-Hans-CN", { numeric: true, sensitivity: "base" }) * direction;
      });
    }
    function updateSortHeaders() {
      document.querySelectorAll("th[data-sort]").forEach(th => {
        th.classList.remove("sort-asc", "sort-desc");
        if (th.dataset.sort === sortState.key) {
          th.classList.add(sortState.direction === "asc" ? "sort-asc" : "sort-desc");
        }
      });
    }
    function applyFilters(keepPage = false) {
      const sourceRows = categoryFilter === "all" ? totalInventoryRows : inventory;
      currentRows = sourceRows.filter(item => {
        const matchStatus = item["_rowType"] === "category" || els.showDisabled.checked || item["状态"] !== "停用";
        return matchStatus && categoryMatches(item) && matchesKeyword(item) && passesStockFilter(item, els.stockFilter.value);
      });
      applySort();
      if (!keepPage) currentPage = 1;
      currentPage = Math.min(Math.max(1, currentPage), getPageCount());
      renderPager();
      renderTable();
      updateSortHeaders();
    }
    function renderPager() {
      const pageCount = getPageCount();
      els.pageSelect.innerHTML = Array.from({ length: pageCount }, (_, index) => `<option value="${index + 1}">${index + 1}</option>`).join("");
      els.pageSelect.value = String(currentPage);
      els.firstPage.disabled = currentPage === 1;
      els.prevPage.disabled = currentPage === 1;
      els.nextPage.disabled = currentPage === pageCount;
      els.lastPage.disabled = currentPage === pageCount;
      els.recordCount.textContent = `(${currentRows.length}条记录)`;
    }
    function renderTable() {
      const pageSize = Number(els.pageSize.value);
      const start = (currentPage - 1) * pageSize;
      pageRows = currentRows.slice(start, start + pageSize);
      if (!selectedRowKey && pageRows[0]) selectedRowKey = rowKey(pageRows[0]);
      els.inventoryBody.innerHTML = pageRows.map((item, index) => {
        const rowNo = start + index + 1;
        const sku = escapeText(item["商品编号"] || "");
        const isCategory = item["_rowType"] === "category";
        const selected = rowKey(item) === selectedRowKey ? " selected" : "";
        const actionText = isCategory ? "展开" : "明细";
        const actionTitle = isCategory ? "查看分类明细" : "查看进出明细";
        return `<tr class="${selected}" data-row-pos="${index}">
          <td class="index-col"><button class="detail-index" type="button" title="${actionTitle}" data-row-pos="${index}">${rowNo}</button></td>
          <td class="sku-col" title="${sku}">${sku}</td>
          <td class="name-col" title="${escapeText(item["商品名称"])}">${escapeText(item["商品名称"])}</td>
          <td class="unit-col">${escapeText(item["基本单位"] || "")}</td>
          <td class="num-col ${stockClass(item["库存数量"])}">${formatNumber(item["库存数量"])}</td>
          <td class="num-col ${stockClass(item["可销售库存"])}">${formatNumber(item["可销售库存"])}</td>
          <td class="money-col">${formatNumber(item["成本均价"])}</td>
          <td class="money-col">${formatNumber(item["参考成本价"])}</td>
          <td class="money-col">${formatMoney(item["库存金额"])}</td>
          <td class="num-col">${formatNumber(item["重量"], 4)}</td>
          <td class="money-col">${formatNumber(item["零售价"])}</td>
          <td class="money-col">${formatNumber(item["预设售价"])}</td>
          <td class="status-col">${escapeText(item["状态"] || "")}</td>
          <td class="remark-col" title="${escapeText(item["商品备注"] || "")}">${escapeText(item["商品备注"] || "")}</td>
          <td class="op-col"><button class="detail-btn" type="button" title="${actionTitle}" data-row-pos="${index}">${actionText}</button></td>
        </tr>`;
      }).join("");
      els.emptyState.style.display = currentRows.length ? "none" : "block";
      els.pageStock.textContent = formatNumber(pageRows.reduce((sum, item) => sum + num(item["库存数量"]), 0));
      els.pageSaleable.textContent = formatNumber(pageRows.reduce((sum, item) => sum + num(item["可销售库存"]), 0));
      els.pageAmount.textContent = formatMoney(pageRows.reduce((sum, item) => sum + num(item["库存金额"]), 0));
      document.querySelectorAll("button[data-row-pos]").forEach(button => {
        button.addEventListener("click", event => {
          const item = pageRows[Number(button.dataset.rowPos)];
          if (!item) return;
          selectedRowKey = rowKey(item);
          selectedSku = String(item["商品编号"] || "");
          event.stopPropagation();
          openRow(item);
        });
      });
      document.querySelectorAll("tr[data-row-pos]").forEach(row => {
        row.addEventListener("click", () => {
          const item = pageRows[Number(row.dataset.rowPos)];
          if (!item) return;
          selectedRowKey = rowKey(item);
          selectedSku = String(item["商品编号"] || "");
          renderTable();
        });
        row.addEventListener("dblclick", () => {
          const item = pageRows[Number(row.dataset.rowPos)];
          if (item) openRow(item);
        });
      });
    }
    function rowKey(item) {
      return item["_rowType"] === "category" ? `category:${item["商品名称"] || ""}` : `sku:${item["商品编号"] || ""}`;
    }
    function openRow(item) {
      if (item["_rowType"] === "category") {
        const category = item["商品名称"];
        const target = category === "鱼仔" ? "鱼仔" : category;
        const categoryNode = [...document.querySelectorAll("[data-category]")].find(node => node.dataset.category === target);
        if (categoryNode) categoryNode.click();
        else showToast("这个分类暂时没有展开明细。");
        return;
      }
      openDetails(String(item["商品编号"] || ""));
    }
    function openDetails(sku) {
      const item = inventory.find(row => String(row["商品编号"]) === String(sku));
      if (!item) return;
      selectedSku = String(sku);
      els.modalTitle.textContent = `库存进出详情 - ${item["商品名称"] || ""}`;
      els.modalSubtitle.textContent = `商品编号：${item["商品编号"] || ""}    来源分类：${item["来源分类"] || ""}    仓库：默认仓库    状态：${item["状态"] || "未知"}`;
      const details = [
        ["库存数量", formatNumber(item["库存数量"])],
        ["可销售库存", formatNumber(item["可销售库存"])],
        ["成本均价", formatNumber(item["成本均价"])],
        ["参考成本价", formatNumber(item["参考成本价"])],
        ["库存金额", formatMoney(item["库存金额"])],
        ["重量", formatNumber(item["重量"], 4)],
        ["零售价", formatNumber(item["零售价"])],
        ["预设售价", formatNumber(item["预设售价"])]
      ];
      els.detailGrid.innerHTML = details.map(([label, value]) => `<div class="detail-cell"><span>${label}</span><strong>${value}</strong></div>`).join("");
      const stock = num(item["库存数量"]);
      els.flowBody.innerHTML = `<tr>
        <td>期初</td><td>期初库存</td>
        <td>${formatNumber(stock > 0 ? stock : 0)}</td>
        <td>${formatNumber(stock < 0 ? Math.abs(stock) : 0)}</td>
        <td class="${stockClass(stock)}">${formatNumber(stock)}</td>
        <td>来自初始库存表；销售表导入接入后会追加每日出入库记录。</td>
      </tr>`;
      els.modalBackdrop.classList.add("open");
      renderTable();
    }
    function openSelectedDetails() {
      const item = pageRows.find(row => rowKey(row) === selectedRowKey) || pageRows[0];
      if (item) openRow(item);
    }
    function closeDetails() { els.modalBackdrop.classList.remove("open"); }
    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 3000);
    }
    function exportCsv() {
      const headers = ["来源分类", "商品编号", "商品名称", "基本单位", "库存数量", "可销售库存", "成本均价", "参考成本价", "库存金额", "重量", "零售价", "预设售价", "状态", "商品备注"];
      const csvRows = [headers, ...currentRows.map(item => headers.map(header => item[header] ?? ""))];
      const csv = csvRows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "库存状况.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
    document.querySelectorAll("[data-category]").forEach(node => {
      node.addEventListener("click", () => {
        document.querySelectorAll("[data-category]").forEach(item => item.classList.remove("active"));
        node.classList.add("active");
        categoryFilter = node.dataset.category;
        applyFilters();
      });
    });
    els.locateBtn.addEventListener("click", () => {
      const key = els.categoryLocate.value.trim();
      if (!key) return;
      const found = [...document.querySelectorAll("[data-category]")].find(node => node.textContent.includes(key));
      if (found) found.click();
      else showToast("没有找到这个类别。");
    });
    els.queryBtn.addEventListener("click", () => applyFilters());
    els.searchInput.addEventListener("input", () => applyFilters());
    els.quickField.addEventListener("change", () => applyFilters());
    els.showDisabled.addEventListener("change", () => applyFilters());
    els.stockFilter.addEventListener("change", () => applyFilters());
    els.refreshBtn.addEventListener("click", () => applyFilters(true));
    els.clearBtn.addEventListener("click", () => {
      els.searchInput.value = "";
      els.quickField.value = "all";
      els.showDisabled.checked = true;
      els.stockFilter.value = "all";
      categoryFilter = "all";
      document.querySelectorAll("[data-category]").forEach(item => item.classList.toggle("active", item.dataset.category === "all"));
      applyFilters();
    });
    els.pageSize.addEventListener("change", () => applyFilters());
    els.pageSelect.addEventListener("change", () => {
      currentPage = Number(els.pageSelect.value);
      applyFilters(true);
    });
    els.firstPage.addEventListener("click", () => { currentPage = 1; applyFilters(true); });
    els.prevPage.addEventListener("click", () => { currentPage -= 1; applyFilters(true); });
    els.nextPage.addEventListener("click", () => { currentPage += 1; applyFilters(true); });
    els.lastPage.addEventListener("click", () => { currentPage = getPageCount(); applyFilters(true); });
    els.closeModalBtn.addEventListener("click", closeDetails);
    els.modalBackdrop.addEventListener("click", event => {
      if (event.target === els.modalBackdrop) closeDetails();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetails();
      if (event.key === "F7") {
        event.preventDefault();
        window.print();
      }
    });
    document.querySelectorAll("th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortState.key === key) {
          sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
        } else {
          sortState = { key, direction: "asc", type: th.dataset.sortType || "text" };
        }
        applyFilters();
      });
    });
    els.importBtn.addEventListener("click", () => showToast("导入销售表功能已预留：下一步会读取每日销售表，按商品编号自动扣减或调整库存。"));
    els.futureImportNav.addEventListener("click", () => showToast("设置入口已预留，可用于维护导入规则和仓库参数。"));
    els.exportCsvBtn.addEventListener("click", exportCsv);
    els.detailOpenBtn.addEventListener("click", openSelectedDetails);
    els.printBtn.addEventListener("click", () => window.print());
    updateSummary();
    applyFilters();
  </script>
</body>
</html>
